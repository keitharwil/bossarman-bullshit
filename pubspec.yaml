name: boss_arman_motohub
description: "Boss Arman MotoHub: An Integrated Mobile POS, Inventory Management and Service Booking Application for Santa Cruz, Laguna."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  material_3_expressive: 1.1.3
  material_ui: ^1.4.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  uuid: ^4.6.0
  crypto: ^3.0.7
  sqflite_common_ffi: 2.3.4
  flutter_local_notifications: ^22.3.1
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0
  sqlite3: 2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/admin_logo.png
    - assets/images/customer_logo.png
    - assets/images/logo.png
    - assets/images/logo_cropped.png
